/* Versão premium limpa: sem calendário duplicado no fundo */
.app{background:radial-gradient(ellipse at 80% 0%,#124680 0%,transparent 47%),linear-gradient(130deg,#020e2a 0%,#06295b 55%,#020d27 100%)}
.app:after{opacity:.3;z-index:0}.head,.main,.footer,.fine{position:relative;z-index:1}
.panel{background:linear-gradient(145deg,#031633 0%,#061c40 100%);box-shadow:0 0 12px #0b7dc255,inset 0 0 20px #06386b66}
.cal{background:#f6f8ff}.datebox,.weather,.counter{background:linear-gradient(155deg,#04132e,#062450)}
.weather{padding:.8vw .65vw;gap:.25vw;justify-content:center;min-width:0}
.weather h3{font-size:clamp(11px,1.12vw,22px);line-height:1.12}
.weather .city{font-size:clamp(10px,.87vw,18px);line-height:1.1}
.weatherIcon{font-size:clamp(28px,3.5vw,66px);line-height:1.2}
.temp{font-size:clamp(11px,1.14vw,23px);line-height:1.18;white-space:nowrap}
.wxdesc{font-size:clamp(9px,.8vw,16px);line-height:1.2;overflow-wrap:anywhere}
.counter:before{left:auto;right:2%;width:29%;height:76%;border-radius:50%;transform-origin:center;animation:counterRing 6s linear infinite;pointer-events:none}
.counter{justify-content:space-around;gap:0;padding:0 1.1vw}
.counterLabel{flex:1;text-align:center}.counterNumber{flex:1;min-width:0}
@keyframes counterRing{0%{transform:rotate(0deg);filter:brightness(1)}50%{transform:rotate(180deg);filter:brightness(1.5)}100%{transform:rotate(360deg);filter:brightness(1)}}
@media(max-width:1100px){.weather h3{font-size:1.2vw}.temp{font-size:1.1vw}.wxdesc{font-size:.85vw}}

/* 2026-10-26: ajustes de responsividade para o painel Samsung Android. */
html,body{width:100%;height:100%;overflow:hidden}
.app{height:100vh;height:100dvh;min-height:0;width:100%;padding:1vh 1.4vw 1vh;overflow:hidden}
.head{height:18%;flex:0 0 18%;gap:1.4vw;min-height:0;overflow:hidden}
.logo{width:min(9.7vw,15vh);height:min(9.7vw,15vh);border-width:.4vw}
.school{font-size:clamp(16px,min(3vw,5vh),54px);line-height:1.08}
.slogan{font-size:clamp(13px,min(2.2vw,3.5vh),37px);line-height:1.12;margin-top:.3vh}
.main{grid-template-columns:minmax(0,58fr) minmax(0,42fr);gap:.8vw;min-width:0;min-height:0;flex:1}
.main > *, .right > * {min-width:0;min-height:0}
.panel{border-width:1.5px;border-radius:1.6vw}
.month{display:grid;place-items:center;flex:0 0 13%;padding:0;font-size:clamp(16px,min(3vw,5vh),55px);line-height:1}
.week{flex:0 0 7%;margin:0;align-items:center;font-size:clamp(10px,min(1.35vw,2.5vh),25px)}
.dates{flex:1;min-height:0;gap:min(.35vw,.5vh);padding-top:.3vh;padding-bottom:.3vh}
.day{font-size:clamp(11px,min(1.65vw,3.2vh),30px);border-radius:.45vw}
.legend{height:8%;flex:0 0 8%;font-size:clamp(9px,min(1vw,2vh),20px);white-space:nowrap;padding:0}
.right{grid-template-columns:minmax(0,72fr) minmax(0,28fr);grid-template-rows:minmax(0,48fr) minmax(0,52fr);gap:.7vw;padding-right:0}
.datebox{display:grid;grid-template-rows:minmax(0,auto) minmax(0,1fr) minmax(0,auto);place-items:center;padding:.8vh .5vw;overflow:hidden}
.weekday{font-size:clamp(13px,min(2.15vw,3.6vh),38px);line-height:1.05;text-align:center;max-width:100%}
.bigday{font-size:clamp(50px,min(9vw,17vh),155px);line-height:.95;align-self:center;white-space:nowrap}
.datecaption{font-size:clamp(12px,min(1.85vw,3.3vh),34px);line-height:1.05;white-space:nowrap;text-align:center}
.weather{padding:.55vh .25vw;gap:.2vh;justify-content:space-evenly;overflow:hidden}
.weather h3{font-size:clamp(10px,min(1.14vw,2.3vh),20px)}
.weather .city{font-size:clamp(9px,min(.9vw,1.9vh),17px)}
.weatherIcon{font-size:clamp(24px,min(3.1vw,6vh),55px)}
.temp{font-size:clamp(10px,min(1.12vw,2.15vh),20px)}
.wxdesc{font-size:clamp(8px,min(.8vw,1.5vh),14px)}
.counter{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1vw;justify-items:center;align-items:center;overflow:hidden;padding:1.2vh 1.4vw}
.counterLabel{font-size:clamp(15px,min(2.15vw,3.8vh),39px);line-height:1.15;max-width:100%}
.counterNumber{font-size:clamp(55px,min(8.7vw,16.8vh),155px);line-height:1.05;min-width:0;max-width:100%;padding:0 .2vw}
.counterNumber::before,.counterNumber::after{width:calc(100% + .3vw);height:1.1em;border-width:2px}
.footer{flex:0 0 10%;height:10%;margin-top:.7vw;padding:.45vh 1.2vw;gap:.5vw;border-radius:1.2vw;min-height:0}
.alertDate{font-size:clamp(15px,min(2.8vw,4.5vh),51px)}
.alert{font-size:clamp(11px,min(2.05vw,3.7vh),36px);padding:.4vh .8vw;white-space:nowrap}
.alertText{font-size:clamp(11px,min(1.95vw,3.5vh),36px)}
.fine{font-size:clamp(7px,.55vw,10px)}
@media(max-aspect-ratio:1.38){
 .app{padding:.8vh 1vw}
 .head{height:16%;flex-basis:16%}
 .main{grid-template-columns:minmax(0,57fr) minmax(0,43fr)}
 .weekday{font-size:clamp(11px,min(1.9vw,3vh),30px)}
 .counter{gap:.1vw;padding:1vh .4vw}
 .counterLabel{font-size:clamp(12px,min(1.9vw,3vh),30px)}
 .counterNumber{font-size:clamp(50px,min(7.7vw,13vh),130px)}
}

const Y=2026;const schoolDays=[];function add(m,days){days.forEach(d=>schoolDays.push(`${Y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`))}

const off={'2026-10-12':'Feriado: Nossa Senhora Aparecida','2026-10-13':'Recesso: Dia do Professor','2026-10-30':'Recesso escolar','2026-11-02':'Finados','2026-11-15':'Proclamação da República','2026-11-19':'Parada pedagógica','2026-11-20':'Consciência Negra'};

async function weather(){

 const latitude=-26.37,longitude=-50.14;
 const endpoints=[

 ];
 desc.textContent='Consultando Papanduva…';
 for(const url of endpoints){
  try{
   const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),10000);
   let r;try{r=await fetch(url,{signal:controller.signal,cache:'no-store'});}finally{clearTimeout(timer);}
   if(!r.ok)throw Error('HTTP '+r.status);
   const j=await r.json(),now=j.current||j.current_weather;
   if(!now||!j.daily)throw Error('Dados incompletos');
   const code=now.weather_code??now.weathercode;
   ico.textContent=code<=1?'☀️':code<=3?'⛅':code<=48?'🌫️':code<=67?'🌧️':code<=77?'❄️':code<=82?'🌦️':'⛈️';
   temp.innerHTML=`AGORA ${Math.round(now.temperature_2m??now.temperature)}°C<br>MÁX. ${Math.round(j.daily.temperature_2m_max[0])}°C<br>MÍN. ${Math.round(j.daily.temperature_2m_min[0])}°C`;
   desc.textContent='Papanduva · dados atualizados';return;
  }catch(e){console.warn('Previsão indisponível:',e);}
 }
